
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Bootstrap Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <a href="index.html">Back to tasks</a>

    <h1 class="mt-4">Task 2. Bootstrap Form Styling</h1>

    <form>
        <div class="row g-3">
            <div class="col-md-6">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control"
                       placeholder="Enter your name">
                <div class="form-text">Enter your full name.</div>
            </div>

            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control"
                       placeholder="name@example.com">
                <div class="form-text">Enter your email address.</div>
            </div>

            <div class="col-12">
                <label for="subject" class="form-label">Subject</label>
                <input type="text" id="subject" class="form-control"
                       placeholder="Message subject">
            </div>

            <div class="col-12">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" class="form-control"
                          rows="4" placeholder="Write your message"></textarea>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary">
                    Send Message
                </button>
            </div>
        </div>
    </form>
</div>
</body>
</html>
