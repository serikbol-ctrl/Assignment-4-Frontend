
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <a href="index.html">Back to tasks</a>

    <h1 class="mt-4 mb-4">Task 4. Registration Form</h1>

    <form id="registrationForm" novalidate>
        <div class="row g-3">
            <div class="col-md-6">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" id="firstName" class="form-control"
                       required minlength="2">
                <div class="invalid-feedback">Enter your first name.</div>
            </div>

            <div class="col-md-6">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" id="lastName" class="form-control"
                       required minlength="2">
                <div class="invalid-feedback">Enter your last name.</div>
            </div>

            <div class="col-12">
                <label for="regEmail" class="form-label">Email</label>
                <input type="email" id="regEmail" class="form-control" required>
                <div class="invalid-feedback">Enter a valid email.</div>
            </div>

            <div class="col-md-6">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control"
                       required minlength="8">
                <div class="invalid-feedback">
                    Password must contain at least 8 characters.
                </div>
            </div>

            <div class="col-md-6">
                <label for="confirmPassword" class="form-label">
                    Confirm Password
                </label>
                <input type="password" id="confirmPassword"
                       class="form-control" required>
                <div class="invalid-feedback">Passwords must match.</div>
            </div>

            <div class="col-12">
                <label class="form-label d-block">Gender</label>

                <div class="form-check form-check-inline">
                    <input type="radio" id="female" name="gender"
                           value="Female" class="form-check-input" required>
                    <label for="female" class="form-check-label">Female</label>
                </div>

                <div class="form-check form-check-inline">
                    <input type="radio" id="male" name="gender"
                           value="Male" class="form-check-input" required>
                    <label for="male" class="form-check-label">Male</label>
                </div>

                <div class="form-check form-check-inline">
                    <input type="radio" id="other" name="gender"
                           value="Other" class="form-check-input" required>
                    <label for="other" class="form-check-label">Other</label>
                </div>
            </div>

            <div class="col-12">
                <label class="form-label d-block">Hobbies</label>

                <div class="form-check form-check-inline">
                    <input type="checkbox" id="reading" name="hobbies"
                           class="form-check-input" value="Reading">
                    <label for="reading" class="form-check-label">Reading</label>
                </div>

                <div class="form-check form-check-inline">
                    <input type="checkbox" id="sports" name="hobbies"
                           class="form-check-input" value="Sports">
                    <label for="sports" class="form-check-label">Sports</label>
                </div>

                <div class="form-check form-check-inline">
                    <input type="checkbox" id="music" name="hobbies"
                           class="form-check-input" value="Music">
                    <label for="music" class="form-check-label">Music</label>
                </div>
            </div>

            <div class="col-12">
                <label for="country" class="form-label">Country</label>
                <select id="country" class="form-select" required>
                    <option value="">Choose your country</option>
                    <option value="Kazakhstan">Kazakhstan</option>
                    <option value="Uzbekistan">Uzbekistan</option>
                    <option value="Kyrgyzstan">Kyrgyzstan</option>
                    <option value="Other">Other</option>
                </select>
                <div class="invalid-feedback">Select your country.</div>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary">
                    Register
                </button>
                <button type="reset" class="btn btn-secondary">
                    Reset
                </button>
            </div>

            <div class="col-12">
                <div id="registrationResult"></div>
            </div>
        </div>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
